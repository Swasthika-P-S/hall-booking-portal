    <script>
         let currentSelectedLocation = null;
        let currentSelectedSlot = null;
        let instructorName = "Unknown";
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
             this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 1;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            else if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = document.body.classList.contains('light-mode') ? `rgba(255, 117, 140, ${this.opacity})` : `rgba(107, 52, 245, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        }
        for (let i = 0; i < 100; i++) {
        particlesArray.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
            particle.update();
            particle.draw();
        });
        requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        });

        modeToggle.querySelector('.slider').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        });
        window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        modeToggle.querySelector('.slider').textContent = '☀️';
        } else {
            modeToggle.querySelector('.slider').textContent = '🌙';
        }
    });

        async function fetchLocations() {
            try {
                const response = await fetch("http://localhost:3000/get-locations");
                const data = await response.json();

                const locations = data.locations;
                const floors = data.floors;

                const groundContainer = document.getElementById("groundContainer");
                const firstContainer = document.getElementById("firstContainer");
                const secondContainer = document.getElementById("secondContainer");
                const thirdContainer = document.getElementById("thirdContainer");

                groundContainer.querySelectorAll(".location-item").forEach(item => item.remove());
                firstContainer.querySelectorAll(".location-item").forEach(item => item.remove());
                secondContainer.querySelectorAll(".location-item").forEach(item => item.remove());
                thirdContainer.querySelectorAll(".location-item").forEach(item => item.remove());

                locations.forEach((location, index) => {
                    const floor = floors[index];
                    const locationDiv = document.createElement("div");
                    locationDiv.className = "location-item";
                    locationDiv.textContent = location;

                    if (floor === "Ground") {
                        groundContainer.appendChild(locationDiv);
                    } else if (floor === "First") {
                        firstContainer.appendChild(locationDiv);
                    } else if (floor === "Second") {
                        secondContainer.appendChild(locationDiv);
                    }
                    else if(floor=="Third"){
                        thirdContainer.appendChild(locationDiv);

                    }
                });
            } catch (error) {
                console.error("Error fetching locations:", error);
            }
        }

        async function fetchAvailableLocations(slot) {
            currentSelectedSlot = slot; // Store the selected slot
                const date = getSelectedDate(); // Use selected date from date picker

                try {
                    // Fetch both API responses
                    const [response1, response2] = await Promise.all([
                        fetch(`http://localhost:3000/get-available-locations?date=${date}&slot=${slot}`).then(res => res.json()),
                        fetch(`http://localhost:3000/get-locations-by-date-slot?date=${date}&slot=${slot}`).then(res => res.json())
                    ]);

                    // Extract available locations from both responses
                    const availableLocations = response1.availableLocations || [];
                    const unavailableLocations = response2 || []; // Directly an array

                    // First, highlight available locations (green)
                    highlightAvailableLocations(availableLocations);

                    // Then, highlight unavailable locations (red) (overrides green if needed)
                    highlightUnavailableLocations(unavailableLocations);

                } catch (error) {
                    console.error("Error fetching available locations:", error);
                }
            }


        // Function to fetch instructor name
        async function fetchInstructorName() {
            try {
                const userEmail = localStorage.getItem("email");
                if (!userEmail) {
                    console.error("No email found in localStorage");
                    return;
                }

                const response = await fetch(`http://localhost:3000/get-user?email=${encodeURIComponent(userEmail)}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                if (data && data.name) {
                    instructorName = data.name;
                } else if (data && data.username) {
                    instructorName = data.username;
                } else {
                    console.error("User name not found in response");
                    instructorName = "Unknown";
                }
            } catch (error) {
                console.error("Error fetching user name:", error);
                instructorName = "Error";
            }
        }
async function showBookingDetails(location) {
    const date = getSelectedDate();
    const slot = currentSelectedSlot;
    
    try {
        const response = await fetch(`http://localhost:3000/get-booking-details?date=${date}&slot=${slot}&location=${encodeURIComponent(location)}`);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const bookingDetails = await response.json();
        
        if (bookingDetails) {
            // Format the date for display (YYYY-MM-DD)
            const displayDate = bookingDetails.date.split('T')[0];
            
            // Update popup content
            document.getElementById("detailsInstructor").textContent = bookingDetails.instructor || "N/A";
            document.getElementById("detailsLocation").textContent = bookingDetails.location;
            document.getElementById("detailsDate").textContent = displayDate;
            document.getElementById("detailsSlot").textContent = slot;
            document.getElementById("detailsDescription").textContent = bookingDetails.description || "No description provided";
            
            // Show the popup
            document.getElementById("bookingDetailsPopup").classList.add("active");
        } else {
            showMessage("No booking details found for this location");
        }
    } catch (error) {
        console.error("Error fetching booking details:", error);
        showMessage("Could not fetch booking details");
    }
}

        function highlightAvailableLocations(availableLocations) {
    document.querySelectorAll(".location-item").forEach(item => {
        item.style.cursor = "pointer";
        if (availableLocations.includes(item.textContent)) {
            // Available location (green)
            item.style.backgroundColor = "rgba(0,255,0,0.5)";
            item.style.color = "white";
            item.onclick = function() {
                currentSelectedLocation = item.textContent;
                showBookingPopup();
            };
        } else {
            // Unavailable location (red) - show details when clicked
            item.style.backgroundColor = "rgba(255, 0, 0, 1)";
            item.style.color = "white";
            item.onclick = function() {
                showBookingDetails(item.textContent);
            };
        }
    });
}
