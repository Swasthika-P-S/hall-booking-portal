  <script>
    const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
             this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 1;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            else if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = document.body.classList.contains('light-mode') ? `rgba(255, 117, 140, ${this.opacity})` : `rgba(107, 52, 245, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        }
        for (let i = 0; i < 100; i++) {
        particlesArray.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
            particle.update();
            particle.draw();
        });
        requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        });
        const modeToggle = document.getElementById('mode-toggle');
        modeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        modeToggle.querySelector('.slider').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        });
        window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        modeToggle.querySelector('.slider').textContent = '☀️';
        } else {
            modeToggle.querySelector('.slider').textContent = '🌙';
        }
    });
            document.addEventListener("DOMContentLoaded", function () {
                let dropdown = document.querySelector(".dropdown");
                let dropdownMenu = dropdown.querySelector("ul");
                let timeout;

                dropdown.addEventListener("mouseenter", function () {
                clearTimeout(timeout);
                dropdownMenu.style.display = "block";
            });

                dropdown.addEventListener("mouseleave", function () {
                timeout = setTimeout(() => {
                    dropdownMenu.style.display = "none";
                }, 200);
            });

            dropdownMenu.addEventListener("mouseenter", function () {
                clearTimeout(timeout);
            });

            dropdownMenu.addEventListener("mouseleave", function () {
                timeout = setTimeout(() => {
                    dropdownMenu.style.display = "none";
                }, 200);
            });

            const userEmail = localStorage.getItem("userEmail");

            if (!userEmail) {
                showMessage("User email is missing. Please log in again.");
                return;
            }
        });

const halls = [
  {
    name: 'Anugraha Hall',
    capacity: 300,
    location: 'Block A',
    description: 'Large hall with stage, projector, sound system, and air conditioning. Suitable for major college events.',
    image: '/images/anugraha.jpeg'
  },
  {
    name: 'Seminar Hall 1',
    capacity: 100,
    location: 'Block B',
    description: 'Modern hall ideal for seminars and workshops. Equipped with projector, mic setup, and good seating.',
    image: '/images/sh1.png'
  },
  {
    name: 'Seminar Hall 2',
    capacity: 50,
    location: 'Admin Block',
    description: 'Small, quiet hall for meetings and presentations. Well-suited for panel discussions and small groups.',
    image: '/images/sh2.png'
  }
];


    function renderInitialCards() {
      const grid = document.getElementById('hall-grid');
      grid.innerHTML = '';
      for (const hall of halls) {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${hall.image}" alt="${hall.name}" />
          <div class="card-content">
            <h2>${hall.name}</h2>
            <p>Capacity: ${hall.capacity} | Location: ${hall.location}</p>
            <p>${hall.description}</p>
            <input type="text" placeholder="Purpose / Message" id="message-${hall.name}" style="margin-top: 10px; padding: 8px; width: 100%; border-radius: 6px; border: 1px solid #ccc;" disabled />
            <button class="btn" disabled>Book Now</button>
            <button class="btn" onclick="viewBookings('${hall.name}')">View Bookings</button>
          </div>`;
        grid.appendChild(card);
      }
    }

    async function fetchBookingsForVenue(venue, date) {
      const res = await fetch(`/api/filtered-bookings?venue=${encodeURIComponent(venue)}&date=${date}`);
      const data = await res.json();
      return data.bookings || [];
    }

    async function checkAvailabilityAndRender() {
      const date = document.getElementById('booking-date').value;
      const start = document.getElementById('start-time').value;
      const end = document.getElementById('end-time').value;
      const grid = document.getElementById('hall-grid');
      grid.innerHTML = '';

      if (!date || !start || !end) {
        renderInitialCards();
        return;
      }

      for (const hall of halls) {
        const bookings = await fetchBookingsForVenue(hall.name, date);
        let isAvailable = true;

        for (const b of bookings) {
          if (start < b.endTime && end > b.startTime) {
            isAvailable = false;
            break;
          }
        }

        const card = document.createElement('div');
        card.className = 'card' + (isAvailable ? '' : ' disabled');
        card.innerHTML = `
          <img src="${hall.image}" alt="${hall.name}" />
          <div class="card-content">
            <h2>${hall.name}</h2>
            <p>Capacity: ${hall.capacity} | Location: ${hall.location}</p>
            <p>${hall.description}</p>
            <input type="text" placeholder="Purpose / Message" id="message-${hall.name}" style="margin-top: 10px; padding: 8px; width: 100%; border-radius: 6px; border: 1px solid #ccc;" ${!isAvailable ? 'disabled' : ''} />
            <button class="btn" ${!isAvailable ? 'disabled' : ''} onclick="bookHall('${hall.name}')">Book Now</button>
            <button class="btn" onclick="viewBookings('${hall.name}')">View Bookings</button>
          </div>`;
        grid.appendChild(card);
      }
    }

    async function bookHall(hallName) {
  const date = document.getElementById("booking-date").value;
  const startTime = document.getElementById("start-time").value;
  const endTime = document.getElementById("end-time").value;
  const message = document.getElementById(`message-${hallName}`).value;
  const userEmail = localStorage.getItem("userEmail");

  if (!date || !startTime || !endTime || !message) {
    showMessage("All fields including message are required.");
    return;
  }

  const now = new Date();
  const start = new Date(`${date}T${startTime}`);
  let end = new Date(`${date}T${endTime}`);

  // Handle overnight booking: if end <= start, assume end is next day
  if (end <= start) {
    end.setDate(end.getDate() + 1);
  }

  const diffMinutes = (end - start) / (1000 * 60);

  // Check if booking date is in the past
  const bookingDate = new Date(date);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (bookingDate < today) {
    showMessage("Booking date cannot be in the past.");
    return;
  }

  // If booking is for today, make sure start time is not in the past
  if (bookingDate.toDateString() === now.toDateString() && start < now) {
    showMessage("Start time cannot be in the past.");
    return;
  }

  // Check duration
  if (diffMinutes < 30) {
    showMessage("The booking duration must be at least 30 minutes.");
    return;
  }

  try {
    const res = await fetch("/submit-booking", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userEmail, venue: hallName, date, startTime, endTime, message }),
    });

    const data = await res.json();
    showMessage(data.message || data.error);
    if (res.ok) checkAvailabilityAndRender();
  } catch (error) {
    console.error("Booking error:", error);
    showMessage("Error occurred while booking. Please try again.");
  }
}
    async function viewBookings(hallName) {
  const confirmedTbody = document.getElementById('modal-bookings-body');
  const pendingTbody = document.getElementById('pending-requests-body');

  confirmedTbody.innerHTML = '';
  pendingTbody.innerHTML = '';

  try {
    // Fetch confirmed bookings
    const confirmedRes = await fetch(`/api/bookings/upcoming?venue=${encodeURIComponent(hallName)}`);
    const confirmedData = await confirmedRes.json();
    const confirmed = confirmedData.bookings || [];

    if (confirmed.length === 0) {
      confirmedTbody.innerHTML = '<tr><td colspan="4">No confirmed bookings.</td></tr>';
    } else {
      confirmed.forEach(b => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${b.date}</td><td>${b.startTime}</td><td>${b.endTime}</td><td>${b.message || ''}</td>`;
        confirmedTbody.appendChild(row);
      });
    }

    // Fetch pending requests
    const pendingRes = await fetch(`/api/bookings/pending?venue=${encodeURIComponent(hallName)}`);
    const pendingData = await pendingRes.json();
    const pending = pendingData.bookings || [];

    if (pending.length === 0) {
      pendingTbody.innerHTML = '<tr><td colspan="4">No pending requests.</td></tr>';
    } else {
      pending.forEach(b => {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${b.date}</td><td>${b.startTime}</td><td>${b.endTime}</td><td>${b.message || ''}</td>`;
        pendingTbody.appendChild(row);
      });
    }

    document.getElementById('booking-modal').style.display = 'flex';
  } catch (err) {
    console.error("Error loading bookings:", err);
    confirmedTbody.innerHTML = '<tr><td colspan="4">Error loading confirmed bookings.</td></tr>';
    pendingTbody.innerHTML = '<tr><td colspan="4">Error loading pending requests.</td></tr>';
    document.getElementById('booking-modal').style.display = 'flex';
  }
}

function closeModal() {
  document.getElementById('booking-modal').style.display = 'none';
}

        });
        gsap.from('.navbar', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
        gsap.from('h1', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.2 });
        gsap.from('.form-container', { duration: 1, opacity: 0, scale: 0.9, ease: 'power3.out', delay: 0.4 });
        function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');

    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropbtn');

      button.addEventListener('click', function (e) {
        e.preventDefault();

        // Close other dropdowns
        dropdowns.forEach(d => {
          if (d !== dropdown) d.classList.remove('show');
        });

        // Toggle current dropdown
        dropdown.classList.toggle('show');
      });
    });

    // Close all dropdowns on outside click
    document.addEventListener('click', function (e) {
      dropdowns.forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  });
  function showMessage(msg) {
  document.getElementById("messageText").textContent = msg;
  const modal = document.getElementById("messageModal");
  modal.style.display = "block";

  document.getElementById("messageOk").onclick = function () {
    modal.style.display = "none";
  };
}
  </script>
