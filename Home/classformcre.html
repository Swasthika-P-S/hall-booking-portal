<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Form</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <script>
        if (!localStorage.getItem("email")) {
            window.location.href = "/";
        }  
    </script>
    <style>
        :root {
            --bg-color: #0A0A0F;
            --text-color: #E0E0E0;
            --card-bg: rgba(20, 20, 30, 0.9);
            --nav-bg: rgba(10, 10, 15, 0.9);
            --input-bg: rgba(40, 40, 50, 0.8);
            --gradient: linear-gradient(135deg, #6F42C1, #BB86FC);
            --gradient1: linear-gradient(235deg, #6F42C1, #BB86FC);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            --border: rgba(107, 52, 245, 0.2);
        }

        .light-mode {
            --bg-color: #F5F6FA;
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.9);
            --nav-bg: rgba(245, 246, 250, 0.9);
            --input-bg: rgba(240, 240, 245, 0.8);
            --table-cell-bg: rgba(230, 230, 235, 0.8);
            --gradient: linear-gradient(135deg, #FFA07A, #FF69B4);
            --gradient1: linear-gradient(235deg, #FFA07A, #FF69B4);
            --gradient-start: #FF758C;
            --gradient-end: #FCD968;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --border: rgba(0, 0, 0, 0.2);
            --accent-color: #FF758C;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
            transition: background 0.3s, color 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--nav-bg);
            padding: 20px 40px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
        }

        .nav-links li {
            margin: 0 20px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: color 0.3s, transform 0.3s;
        }

        .nav-links a:hover {
            color: #6B34F5;
            transform: translateY(-2px);
        }

        .hamburger {
            display: none;
            font-size: 28px;
            color: var(--text-color);
            cursor: pointer;
            transition: color 0.3s;
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
                flex-direction: column;
                background: var(--nav-bg);
                position: absolute;
                top: 80px;
                left: 0;
                width: 100%;
                text-align: center;
                padding: 20px 0;
                transition: background 0.3s;
            }
            .nav-links.active {
                display: flex;
            }
            .hamburger {
                display: block;
            }
            .nav-links li {
                margin-bottom: 10px;
            }
        }

        #logo {
            height: 60px;
            filter: brightness(1.2);
        }

        #logout-btn {
            background: var(--gradient);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(107, 52, 245, 0.4);
        }

        #logout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(107, 52, 245, 0.6);
        }

        #logout-btn:active {
            background: #4a20b3;
            transform: scale(0.98);
        }

        h1 {
            text-align: center;
            margin: 60px 0 40px;
            color: var(--text-color);
            font-size: 36px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: color 0.3s;
        }

        .mode-toggle {
            position: relative;
            width: 60px;
            height: 30px;
            background: var(--gradient);
            border-radius: 25px;
            cursor: pointer;
            overflow: hidden;
        }

        .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .light-mode .slider {
            transform: translateX(30px);
        }

        nav ul li .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
            left: 0;
            top: 100%;
            margin-top: 10px;
        }

        nav ul li {
            position: relative;
        }

        nav ul li .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        nav ul li .dropdown-content a:hover {
            background-color: #ddd;
        }

        nav ul li:hover .dropdown-content {
            display: block;
        }

        nav ul li.show .dropdown-content {
            display: block;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border);
            transition: background 0.3s, box-shadow 0.3s, border 0.3s;
        }

        .form-container label {
            font-weight: 600;
            color: var(--text-color);
            font-size: 16px;
            margin-top: 15px;
            display: block;
            text-align: left;
            width: 100%;
            transition: color 0.3s;
        }

        .form-container input,
        .form-container select,
        .form-container textarea {
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            background: var(--input-bg);
            color: var(--text-color);
            transition: border-color 0.3s, background 0.3s, color 0.3s;
        }

        .form-container textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-container button {
            padding: 12px 18px;
            background: var(--gradient);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(107, 52, 245, 0.4);
            margin-top: 15px;
        }

        .form-container button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(107, 52, 245, 0.6);
        }

        .form-container button:active {
            transform: scale(0.98);
            background: #4a20b3;
        }

        #loader {
            margin-top: 15px;
            color: var(--text-color);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .form-container {
                width: 90%;
                padding: 20px;
            }
            button {
                font-size: 13px;
            }
        }

        #messageModal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }

        .messmodal-content {
            background-color: #fff;
            margin: 25% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            color: palevioletred;
        }

        #messageOk {
            background: var(--gradient);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.3s;
            font-weight: 600;
            margin: 0 10px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .messmodal {
                margin-top: 80px;
            }
        }
  
        @media (max-width: 768px) {
            .messmodal {
                margin-top: 80px;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <nav class="navbar">
        <img src="/images/logo.png" id="logo">
        <ul class="nav-links">
            <li class="dropdown">
                <a href="#" class="dropbtn">Classroom</a>
                <div class="dropdown-content">
                    <a href="/bookclass">Book Class</a>
                    <a href="/displayclass">Check Availability</a>
                </div>
            </li>
            <li class="dropdown">
                <a href="#" class="dropbtn">Hall</a>
                <div class="dropdown-content">
                    <a href="/booking">Book Hall</a>
                    <a href="/forall">Check Availability</a>
                </div>
            </li>
            <li class="dropdown">
                <a href="/homepage">Home</a>
            </li>
            <li><button id="logout-btn">Logout</button></li>
            <li><div class="mode-toggle" id="mode-toggle"><div class="slider">🌙</div></div></li>
        </ul>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </nav> 
    <h1>Create Class</h1>      
    <div class="form-container">
        <form id="classForm">
            <label for="courseName">Course Name:</label>
            <input type="text" id="courseName" name="courseName" required>

            <label for="courseCode">Course Code:</label>
            <input type="text" id="courseCode" name="courseCode" required>

            <label for="instructor">Instructor:</label>
            <input type="text" id="instructor" name="instructor" required>

            <label for="locationSelect">Location:</label>
            <select name="location" id="locationSelect">
                <option value="">Loading...</option>
            </select>

            <label for="daySelect">Day:</label>
            <select name="day" id="daySelect">
                <option value="">Select a Day</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
            </select>

            <label for="slotSelect">Slot:</label>
            <select name="slot" id="slotSelect">
                <option value="">Please select a slot</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
            </select>

            <label for="timeSelect">Time:</label>
            <select name="time" id="timeSelect" required>
                <option value="">Select a time</option>
                <option value="8:00 to 8:50am">8:00 AM - 8:50 AM</option>
                <option value="8:50 to 9:40am">8:50 AM - 9:40 AM</option>
                <option value="9:40 to 10:30am">9:40 AM - 10:30 AM</option>
                <option value="10:45 to 11:35am">10:45 AM - 11:35 AM</option>
                <option value="11:35 to 12:25pm">11:35 AM - 12:25 PM</option>
                <option value="12:25 to 1:15pm">12:25 PM - 1:15 PM</option>
                <option value="1:15 to 2:05pm">1:15 PM - 2:05 PM</option>
                <option value="2:05 to 2:55pm">2:05 PM - 2:55 PM</option>
                <option value="2:55 to 3:45pm">2:55 PM - 3:45 PM</option>
                <option value="3:45 to 4:35pm">3:45 PM - 4:35 PM</option>
            </select>

            <label for="description">Description:</label>
            <textarea id="description" name="description"></textarea>

            <button type="submit" id="submitBtn">Submit</button>
            <div id="loader" style="display: none;">Loading...</div>
        </form>
    </div>

    <div id="messageModal" class="messmodal">
        <div class="messmodal-content">
            <p id="messageText">This is a message.</p>
            <button id="messageOk">OK</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') ? `rgba(255, 117, 140, ${this.opacity})` : `rgba(107, 52, 245, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        for (let i = 0; i < 100; i++) {
            particlesArray.push(new Particle());
        }
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        
        animateParticles();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        const modeToggle = document.getElementById('mode-toggle');
        modeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            modeToggle.querySelector('.slider').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        });
        
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                modeToggle.querySelector('.slider').textContent = '☀️';
            } else {
                modeToggle.querySelector('.slider').textContent = '🌙';
            }
        });
        
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }
        
        document.addEventListener('DOMContentLoaded', function () {
            const dropdowns = document.querySelectorAll('.dropdown');

            dropdowns.forEach(dropdown => {
                const button = dropdown.querySelector('.dropbtn');

                button.addEventListener('click', function (e) {
                    e.preventDefault();

                    // Close other dropdowns
                    dropdowns.forEach(d => {
                        if (d !== dropdown) d.classList.remove('show');
                    });

                    // Toggle current dropdown
                    dropdown.classList.toggle('show');
                });
            });

            // Close all dropdowns on outside click
            document.addEventListener('click', function (e) {
                dropdowns.forEach(dropdown => {
                    if (!dropdown.contains(e.target)) {
                        dropdown.classList.remove('show');
                    }
                });
            });
        });
        
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', () => {
            // Clear cookies
            document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            localStorage.removeItem('email');
            localStorage.removeItem('userEmail');
            history.replaceState(null, null, "/");
            // Redirect to LoginPage
            window.location.href = '/';
        });
        
        function showMessage(msg) {
            document.getElementById("messageText").textContent = msg;
            const modal = document.getElementById("messageModal");
            modal.style.display = "block";

            document.getElementById("messageOk").onclick = function () {
                modal.style.display = "none";
            };
        }
        
        gsap.from('.navbar', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
        gsap.from('h1', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.2 });
        gsap.from('.form-container', { duration: 1, opacity: 0, scale: 0.9, ease: 'power3.out', delay: 0.4 });
       
        const slotTimes = {
            "1": "8:00 AM - 8:50 AM",
            "2": "8:50 AM - 9:40 AM",
            "3": "9:40 AM - 10:30 AM",
            "4": "10:45 AM - 11:35 AM",
            "5": "11:35 PM - 12:25 PM",
            "6": "12:25 PM - 1:15 PM",
            "7": "1:15 PM - 2:05 PM",
            "8": "2:05 PM - 2:55 PM",
            "9": "2:55 PM - 3:45 PM",
            "10": "3:45 PM - 4:35 PM",
            "11": "4:35 PM - 5:25 PM",
            "12": "5:25 PM - 6:15 PM"
        };

        // Get elements
        const daySelect = document.getElementById("daySelect");
        const slotSelect = document.getElementById("slotSelect");
        const locationSelect = document.getElementById("locationSelect");
        const submitBtn = document.getElementById("submitBtn");
        const loader = document.getElementById("loader");

        // Fetch and populate locations
        async function fetchLocations() {
            try {
                const response = await fetch("/get-locations");
                const data = await response.json();

                locationSelect.innerHTML = ""; // Clear existing options

                data.locations.forEach(location => {
                    const option = document.createElement("option");
                    option.value = location;
                    option.textContent = location;
                    locationSelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error fetching locations:", error);
                showMessage("Failed to load locations.");
            }
        }

        // Function to fetch occupied slots dynamically based on day & location
        async function fetchOccupiedSlots() {
            const selectedDay = daySelect.value;
            const selectedLocation = locationSelect.value;

            if (!selectedDay || !selectedLocation) return;

            try {
                const response = await fetch(`/get-permanent-slots?day=${selectedDay}&location=${selectedLocation}`);
                const occupiedSlots = await response.json();

                // Enable all slots first
                [...slotSelect.options].forEach(option => {
                    option.hidden = false;
                    option.disabled = false;
                });

                // Disable already booked slots for the selected location
                occupiedSlots.forEach(slot => {
                    const option = slotSelect.querySelector(`option[value="${slot}"]`);
                    if (option) {
                        option.hidden = true;
                        option.disabled = true;
                    }
                });
            } catch (error) {
                console.error("Error fetching occupied slots:", error);
                showMessage("Error fetching occupied slots. Please try again.");
            }
        }

        // Update slot availability when either day OR location changes
        daySelect.addEventListener("change", fetchOccupiedSlots);
        locationSelect.addEventListener("change", fetchOccupiedSlots);

        // Handle form submission
        document.getElementById("classForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            // Disable submit button and show loader
            submitBtn.disabled = true;
            loader.style.display = "inline";

            const formData = new FormData(event.target);
            const selectedSlot = formData.get("slot");
            const selectedDay = formData.get("day");

            // Validate slot selection
            if (!selectedDay) {
                showMessage("Please select a day!");
                submitBtn.disabled = false;
                loader.style.display = "none";
                return;
            }

            if (!selectedSlot) {
                showMessage("Please select a valid slot!");
                submitBtn.disabled = false;
                loader.style.display = "none";
                return;
            }
            
            const selectedTime = formData.get("time");
            const data = {
                courseName: formData.get("courseName"),
                courseCode: formData.get("courseCode"),
                instructor: formData.get("instructor"),
                location: formData.get("location"),
                day: selectedDay,
                slots: [{
                    slot: selectedSlot,
                    time: selectedTime,
                    status: "permanent",
                }],
                description: formData.get("description"),
            };

            try {
                const response = await fetch("/add-class", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data),
                });

                const result = await response.json();
                if (response.ok) {
                    showMessage(result.message);

                    // Reset form fields
                    event.target.reset();
                    slotSelect.value = ""; // Reset slot dropdown
                } else {
                    showMessage(`Error: ${result.message}`);
                }
            } catch (error) {
                console.error("Error submitting form:", error);
                showMessage("An error occurred. Please try again.");
            } finally {
                // Re-enable submit button and hide loader
                submitBtn.disabled = false;
                loader.style.display = "none";
            }
        });

        // Load locations when page loads
        fetchLocations();
    </script>
</body>
</html>
