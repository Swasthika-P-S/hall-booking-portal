<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Keshav S">
    <title>Teacher Portal - Sign In</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --bg-color: #0A0A0F;
            --text-color: #E0E0E0;
            --card-bg: rgba(20, 20, 30, 0.9);
            --gradient: linear-gradient(135deg, #900246, #b80257);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            --border: rgba(144, 2, 70, 0.2);
            --input-bg: rgba(255, 255, 255, 0.1);
        }
        .light-mode {
            --bg-color: #F5F6FA;
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.9);
            --gradient: linear-gradient(135deg, #FF758C, #FCD968);
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --border: rgba(255, 117, 140, 0.2);
            --input-bg: rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .logo {
            display: block;
            margin: 0 auto 20px;
            height: 80px;
            filter: brightness(1.2);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1);
        }

        h2 {
            text-align: center;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .error-message {
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        form input[type="text"]:focus,
        form input[type="password"]:focus {
            border-color: #900246;
            box-shadow: 0 0 0 3px rgba(144, 2, 70, 0.2);
        }

        form input[type="submit"] {
            width: 100%;
            padding: 12px;
            background: var(--gradient);
            color: #fff;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        form input[type="submit"]:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(144, 2, 70, 0.4);
        }

        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 30px;
            background: var(--gradient);
            border-radius: 25px;
            cursor: pointer;
            z-index: 2;
        }

        .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .light-mode .slider {
            transform: translateX(30px);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: var(--text-color);
            font-size: 0.8rem;
            opacity: 0.7;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 20px;
                margin: 20px;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="login-container">
        <img src="/images/logo.png" alt="Logo" class="logo">
        <form action="/login" method="POST">
            <h2>Sign In</h2>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <input type="text" id="user" name="username" placeholder="Username" required>
            <input type="password" id="Password" name="password" placeholder="Password" required>
            <input type="submit" value="Login">
        </form>
    </div>

    <div class="mode-toggle" id="mode-toggle">
        <div class="slider">🌙</div>
    </div>

    <div class="footer">
        Created by Keshav S | © 2025 Teacher Portal
    </div>

    <script>
        // Particles Animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') 
                    ? `rgba(255, 117, 140, ${this.opacity})` 
                    : `rgba(144, 2, 70, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 150; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mode Toggle
        const modeToggle = document.getElementById('mode-toggle');
        const slider = modeToggle.querySelector('.slider');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            slider.textContent = '☀️';
        }
        modeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            slider.textContent = isLight ? '☀️' : '🌙';
        });

        // GSAP Animations
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.logo', { duration: 1, scale: 0, opacity: 0, ease: 'back.out(1.7)' });
            gsap.from('.login-container', { duration: 1, y: 50, opacity: 0, ease: 'power3.out', delay: 0.2 });
            gsap.from('form input', { duration: 0.8, y: 20, opacity: 0, stagger: 0.2, ease: 'power3.out', delay: 0.4 });
            gsap.from('.footer', { duration: 1, opacity: 0, delay: 1 });
        });

        // Error Handling
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        if (error) {
            const errorMessageDiv = document.getElementById("error-message");
            errorMessageDiv.textContent = error;
            errorMessageDiv.style.display = "block";
            gsap.from('#error-message', { duration: 0.5, y: -20, opacity: 0, ease: 'power3.out' });
        }

        // Form Submission Animation
        document.querySelector('form').addEventListener('submit', (e) => {
            const submitBtn = document.querySelector('input[type="submit"]');
            gsap.to(submitBtn, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
        });
    </script>
</body>
</html>
