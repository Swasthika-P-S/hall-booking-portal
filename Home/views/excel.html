<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel Upload and Download</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=account_circle" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    if (!localStorage.getItem("email")) {
        window.location.href = "/";
    }  
</script>
  <style>
    :root {
      --bg-color: #0A0A0F;
      --text-color: #E0E0E0;
      --card-bg: rgba(20, 20, 30, 0.9);
      --nav-bg: rgba(10, 10, 15, 0.9);
      --input-bg: rgba(40, 40, 50, 0.8);
      --gradient: linear-gradient(135deg, #6F42C1 , #BB86FC);
      --gradient1: linear-gradient(235deg, #6F42C1 , #BB86FC);
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      --border: rgba(107, 52, 245, 0.2);
}
.light-mode {
            --bg-color: #F5F6FA;
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.9);
            --nav-bg: rgba(245, 246, 250, 0.9);
            --input-bg: rgba(240, 240, 245, 0.8);
            --table-cell-bg: rgba(230, 230, 235, 0.8);
            --gradient: linear-gradient(135deg, #FFA07A , #FF69B4);
            --gradient1: linear-gradient(235deg, #FFA07A , #FF69B4);
            --gradient-start: #FF758C;
            --gradient-end: #FCD968;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --border: rgba(0, 0, 0, 0.2);
            --accent-color: #FF758C;
        }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-color);
      overflow-x: hidden;
      position: relative;
      transition: background 0.3s, color 0.3s;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--nav-bg);
      padding: 20px 40px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
      transition: background 0.3s, box-shadow 0.3s;
    }
    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
    }
    .nav-links li {
      margin: 0 20px;
    }
    .nav-links a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: color 0.3s, transform 0.3s;
    }
    .nav-links a:hover {
      color: #6B34F5;
      transform: translateY(-2px);
    }
    .hamburger {
      display: none;
      font-size: 28px;
      color: var(--text-color);
      cursor: pointer;
      transition: color 0.3s;
    }
    @media (max-width: 768px) {
      .nav-links {
        display: none;
        flex-direction: column;
        background: var(--nav-bg);
        position: absolute;
        top: 80px;
        left: 0;
        width: 100%;
        text-align: center;
        padding: 20px 0;
        transition: background 0.3s;
      }
      .nav-links.active {
        display: flex;
      }
      .hamburger {
        display: block;
      }
      .nav-links li{
        margin-bottom: 10px;
      }
    }
    #logo {
      height: 60px;
      filter: brightness(1.2);
    }
    #logout-btn {
      background: var(--gradient);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 4px 15px rgba(107, 52, 245, 0.4);
    }
    #logout-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(107, 52, 245, 0.6);
    }
    #logout-btn:active {
      background: #4a20b3;
      transform: scale(0.98);
    }
    nav ul li .dropdown-content {
    display: none;
    position: absolute;
    background-color: #f9f9f9;
    min-width: 160px;
    box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
    z-index: 1;
    left: 0;
    top: 100%;
    margin-top: 10px;
}
nav ul li {
    position: relative;
}

        nav ul li .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }
        nav ul li .dropdown-content a:hover {
            background-color: #ddd;
        }
        nav ul li:hover .dropdown-content {
            display: block;
        }
        nav ul li.show .dropdown-content {
  display: block;
}
    h1 {
      text-align: center;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      margin: 40px 0;
    }
    #uploadForm {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      max-width: 400px;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #uploadForm label {
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }
    #uploadForm input[type="file"] {
      padding: 12px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text-color);
      transition: border-color 0.3s;
      margin-bottom: 20px;
    }
    #uploadForm input[type="file"]:focus {
      border-color: #900246;
      box-shadow: 0 0 5px rgba(144, 2, 70, 0.5);
      outline: none;
    }
    #uploadForm button {
      background: var(--gradient);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
      margin: 5px;
      box-shadow: 0 4px 15px rgba(144, 2, 70, 0.4);
    }
    #uploadForm button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(144, 2, 70, 0.6);
    }
    #message {
      text-align: center;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      white-space: pre-wrap;
    }
    #message.success {
      background: rgba(0, 204, 0, 0.1);
      color: #00cc00;
    }
    #message.error {
      background: rgba(220, 53, 69, 0.1);
      color: #dc3545;
    }
    .mode-toggle {
      position: relative;
      width: 60px;
      height: 30px;
      background: var(--gradient);
      border-radius: 25px;
      cursor: pointer;
    }
    .slider {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 26px;
      height: 26px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .light-mode .slider {
      transform: translateX(30px);
    }
    
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
    <nav class="navbar">
      <img src="/images/logo.png" id="logo">
      <ul class="nav-links">
        <li class="dropdown">
          <a href="#" class="dropbtn">Teacher Availability</a>
          <div class="dropdown-content">
              <a href="/ccm">CCM Scheduler</a>
              <a href="/gds">GDS Scheduler</a>
              <a href="/ftm">FTM</a>
          </div>
      </li>
        <li class="dropdown">
            <a href="#" class="dropbtn">Classroom</a>
            <div class="dropdown-content">
                <a href="/bookclass">Book Class</a>
                <a href="/displayclass">Check Availability</a>
                <a href="/locations">Manage Classrooms</a>
            </div>
        </li>
        <li class="dropdown">
            <a href="#" class="dropbtn">Hall</a>
            <div class="dropdown-content">
                <a href="/booking">Book Hall</a>
                <a href="/forall">Check Availability</a>
                <a href="/showuserbooking">Authorize Bookings</a>
                <a href="/viewbooking">Check Bookings</a>
            </div>
        </li>
        <li class="dropdown">
            <a href="/homepage">Home</a>
        </li>
        <li><button id="logout-btn">Logout</button></li>
        <li><div class="mode-toggle" id="mode-toggle"><div class="slider">🌙</div></div></li>
      </ul>
      <div class="hamburger" onclick="toggleMenu()">☰</div>
    </nav> 
  <h1>Excel Upload and Download</h1>
  <form id="uploadForm" enctype="multipart/form-data">
    <label for="excelFile">Upload Excel File:</label>
    <input type="file" id="excelFile" name="excelFile" accept=".xlsx, .xls">
    <button type="submit">Upload</button>
    <button id="downloadBtn" type="button">Download Excel</button>
  </form>
  <p id="message"></p>

  <script>
    // Particles Animation
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particlesArray = [];
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width) this.x = 0;
        else if (this.x < 0) this.x = canvas.width;
        if (this.y > canvas.height) this.y = 0;
        else if (this.y < 0) this.y = canvas.height;
      }
      draw() {
        ctx.fillStyle = document.body.classList.contains('light-mode') 
          ? `rgba(255, 117, 140, ${this.opacity})` 
          : `rgba(144, 2, 70, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    for (let i = 0; i < 100; i++) particlesArray.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(particle => {
        particle.update();
        particle.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // Mode Toggle
    const modeToggle = document.getElementById('mode-toggle');
    const slider = modeToggle.querySelector('.slider');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'light') {
      document.body.classList.add('light-mode');
      slider.textContent = '☀️';
    }
    modeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      slider.textContent = isLight ? '☀️' : '🌙';
    });

    // GSAP Animations
    gsap.from('nav', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
    gsap.from('h1', { duration: 1, opacity: 0, y: 20, ease: 'power3.out', delay: 0.2 });
    gsap.from('#uploadForm', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.4 });


    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('logout-btn').addEventListener('click', () => {
        document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        document.cookie = 'userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        localStorage.clear();
        window.location.href = '/';
      });
    });

    
  document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('excelFile');
    const messageElement = document.getElementById('message');
    if (!fileInput.files.length) {
      messageElement.style.color = 'red';
      messageElement.innerText = 'Please select an Excel file to upload.';
      return;
    }
    const formData = new FormData();
    formData.append('excelFile', fileInput.files[0]);
    try {
      const response = await fetch('/upload-excel', {
        method: 'POST',
        body: formData
      });
      const result = await response.json();
      if (response.ok) {
        messageElement.style.color = 'green';
        messageElement.innerText = result.message;
        if (result.details) {
          messageElement.innerText += `\nTotal Records: ${result.details.totalRecords}
  Upserted: ${result.details.upsertedCount}
  Modified: ${result.details.modifiedCount}`;
        }
      } else {
        messageElement.style.color = 'red';
        messageElement.innerText = result.message || 'Upload failed';
        if (result.invalidRecords) {
          messageElement.innerText += '\nInvalid Records: ' + 
            JSON.stringify(result.invalidRecords);
        }
      }
    } catch (error) {
      console.error('Upload error:', error);
      messageElement.style.color = 'red';
      messageElement.innerText = 'Error uploading file. Please try again.';
    }
  });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      window.location.href = '/download-excel';
    });
    function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');

    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropbtn');

      button.addEventListener('click', function (e) {
        e.preventDefault();

        // Close other dropdowns
        dropdowns.forEach(d => {
          if (d !== dropdown) d.classList.remove('show');
        });

        // Toggle current dropdown
        dropdown.classList.toggle('show');
      });
    });

    // Close all dropdowns on outside click
    document.addEventListener('click', function (e) {
      dropdowns.forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  });
  </script>
</body>
</html>
