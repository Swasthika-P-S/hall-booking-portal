<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" content="Keshav S">
    <title>Admin Portal - Sign In</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
:root {
      --bg-color: #0A0A0F;
      --text-color: #E0E0E0;
      --card-bg: rgba(20, 20, 30, 0.9);
      --nav-bg: rgba(10, 10, 15, 0.9);
      --input-bg: rgba(40, 40, 50, 0.8);
      --gradient: linear-gradient(135deg, #6F42C1 , #BB86FC);
      --gradient1: linear-gradient(235deg, #6F42C1 , #BB86FC);
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      --border: rgba(107, 52, 245, 0.2);
      --quotatext:#FFD700;
      --quotatext1:#d7ffc9;
      --quotatext2:#AAAAAA;
      --author:#ff5cbb;
    }
    .light-mode {
            --bg-color: #F5F6FA;
            --text-color: #333;
            --card-bg: rgba(255, 255, 255, 0.9);
            --nav-bg: rgba(245, 246, 250, 0.9);
            --input-bg: rgba(240, 240, 245, 0.8);
            --table-cell-bg: rgba(230, 230, 235, 0.8);
            --gradient: linear-gradient(135deg, #FFA07A , #FF69B4);
            --gradient1: linear-gradient(235deg, #FFA07A , #FF69B4);
            --gradient-start: #FF758C;
            --gradient-end: #FCD968;
            --shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            --border: rgba(0, 0, 0, 0.2);
            --accent-color: #FF758C;
            --quotatext:#1E88E5 ;
            --quotatext1:#9C27B0 ;
            --quotatext2:#888888;
            --author:#D81B60 ;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
            padding: 20px;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .logo {
            width: 190px;
            margin-bottom: 10px;
            filter: brightness(1.2);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1) rotate(5deg);
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--border);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .login-form h2 {
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 30px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .error-message {
            background: linear-gradient(135deg, #dc3545, #a71d2a);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            box-shadow: 0 2px 10px rgba(220, 53, 69, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: rgba(144, 2, 70, 0.5);
            box-shadow: 0 0 0 3px rgba(144, 2, 70, 0.2);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
        }

        .light-mode .input-group input::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        .login-button {
            width: 100%;
            padding: 16px;
            background: var(--gradient);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(144, 2, 70, 0.3);
        }

        .login-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(144, 2, 70, 0.5);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 30px;
            background: var(--gradient);
            border-radius: 25px;
            cursor: pointer;
            z-index: 2;
        }

        .slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .light-mode .slider {
            transform: translateX(30px);
        }

        .footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: var(--text-color);
            font-size: 0.8rem;
            opacity: 0.7;
            z-index: 1;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px;
                margin: 20px;
            }
            .logo {
                width: 100px;
            }
            .login-form h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <img src="/images/logo.png" alt="Logo" class="logo">
    <div class="container">
        <form class="login-form" action="/login" method="POST">
            <h2>Admin Login</h2>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div class="input-group">
                <input type="text" id="user" name="username" placeholder="Username" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-button">Login</button>
        </form>
    </div>

    <div class="mode-toggle" id="mode-toggle">
        <div class="slider">🌙</div>
    </div>

    <div class="footer">
 | © 2025 Admin Portal  |
    </div>

    <script>
        // Particles Animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') 
                    ? `rgba(255, 117, 140, ${this.opacity})` 
                    : `rgba(144, 2, 70, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 150; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mode Toggle
        const modeToggle = document.getElementById('mode-toggle');
        const slider = modeToggle.querySelector('.slider');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            slider.textContent = '☀️';
        }
        modeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            slider.textContent = isLight ? '☀️' : '🌙';
        });

        // GSAP Animations
        document.addEventListener('DOMContentLoaded', () => {
            gsap.from('.logo', { duration: 1, scale: 0, opacity: 0, ease: 'back.out(1.7)' });
            gsap.from('.container', { duration: 1, y: 50, opacity: 0, ease: 'power3.out', delay: 0.2 });
            gsap.from('.input-group', { duration: 0.8, y: 20, opacity: 0, stagger: 0.2, ease: 'power3.out', delay: 0.4 });
            gsap.from('.login-button', { duration: 0.8, scale: 0.8, opacity: 0, ease: 'power3.out', delay: 0.8 });
            gsap.from('.footer', { duration: 1, opacity: 0, delay: 1 });
        });

        // Error Handling
        const params = new URLSearchParams(window.location.search);
        const error = params.get("error");
        if (error) {
            const errorMessageDiv = document.getElementById("error-message");
            errorMessageDiv.textContent = error;
            errorMessageDiv.style.display = "block";
            gsap.from('#error-message', { duration: 0.5, y: -20, opacity: 0, ease: 'power3.out' });
        }

        // Button Animation on Submit
        document.querySelector('.login-form').addEventListener('submit', (e) => {
            const submitBtn = document.querySelector('.login-button');
            gsap.to(submitBtn, { scale: 0.95, duration: 0.1, yoyo: true, repeat: 1 });
        });
    </script>
</body>
</html>
