    <script>
        // Check authentication without localStorage
        function checkAuth() {
            // Use cookies or session storage alternative
            const cookies = document.cookie.split(';');
            let emailFound = false;
            
            for (let cookie of cookies) {
                if (cookie.trim().startsWith('userEmail=')) {
                    emailFound = true;
                    break;
                }
            }
            
            if (!emailFound) {
                window.location.href = "/";
            }
        }
        
        // Call auth check on page load
        window.addEventListener('DOMContentLoaded', checkAuth);
    </script>

// Particles animation
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const particlesArray = [];

class Particle {
    constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.5 - 0.25;
        this.opacity = Math.random() * 0.5 + 0.2;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width) this.x = 0;
        else if (this.x < 0) this.x = canvas.width;
        if (this.y > canvas.height) this.y = 0;
        else if (this.y < 0) this.y = canvas.height;
    }
    draw() {
        ctx.fillStyle = document.body.classList.contains('light-mode') 
            ? `rgba(255, 117, 140, ${this.opacity})` 
            : `rgba(107, 52, 245, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

for (let i = 0; i < 100; i++) {
    particlesArray.push(new Particle());
}

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particlesArray.forEach(particle => {
        particle.update();
        particle.draw();
    });
    requestAnimationFrame(animateParticles);
}

animateParticles();

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

// Dropdowns
document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');
    dropdowns.forEach(dropdown => {
        const button = dropdown.querySelector('.dropbtn');
        button.addEventListener('click', function (e) {
            e.preventDefault();
            dropdowns.forEach(d => {
                if (d !== dropdown) d.classList.remove('show');
            });
            dropdown.classList.toggle('show');
        });
    });
    document.addEventListener('click', function (e) {
        dropdowns.forEach(dropdown => {
            if (!dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });
    });
});

    document.getElementById("messageText").textContent = msg;
    const modal = document.getElementById("messageModal");
    modal.style.display = "block";
    document.getElementById("messageOk").onclick = function () {

// Upload timetable
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('timetableFile');
    const year = document.getElementById('year').value;
    const semester = document.getElementById('semester').value;
    const submitBtn = document.getElementById('submitBtn');
    const loader = document.getElementById('loader');
    
    if (!year) {
        showMessage('Please select a year.');
        return;
    }
    if (!semester) {
        showMessage('Please select a semester.');
        return;
    }
    if (!fileInput.files.length) {
        showMessage('Please select an Excel file to upload.');
        return;
    }
    
    // Validate file type
    const file = fileInput.files[0];
    const allowedTypes = [
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        'application/vnd.ms-excel',
        '.xlsx',
        '.xls'
    ];
    
    if (!file.name.toLowerCase().endsWith('.xlsx') && !file.name.toLowerCase().endsWith('.xls')) {
        showMessage('Please upload a valid Excel file (.xlsx or .xls).');
        return;
    }
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading...';
    loader.style.display = 'inline';
    
    const formData = new FormData();
    formData.append('timetableFile', file);
    formData.append('year', year);
    formData.append('semester', semester);
    
    try {
        const response = await fetch('/upload-timetable', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            let successMsg = result.message;
            if (result.details) {
                successMsg += `\n\nDetails:`;
                if (result.details.addedCount !== undefined) {
                    successMsg += `\nNew entries added: ${result.details.addedCount}`;
                }
                if (result.details.updatedCount !== undefined) {
                    successMsg += `\nExisting entries updated: ${result.details.updatedCount}`;
                }
                if (result.details.errors && result.details.errors.length > 0) {
                    successMsg += `\n\nWarnings:`;
                    result.details.errors.forEach((err, index) => {
                        successMsg += `\n${index + 1}. ${err}`;
                    });
                }
            }
            showMessage(successMsg);
            // Only reset form on successful upload
            document.getElementById('uploadForm').reset();
        } else {
            let errorMsg = result.message || 'Upload failed';
            if (result.errors && result.errors.length > 0) {
                errorMsg += '\n\nErrors found:';
                result.errors.forEach((err, index) => {
                    errorMsg += `\n${index + 1}. ${err}`;
                });
            }
            showMessage(errorMsg);
        }
    } catch (error) {
        console.error('Upload error:', error);
        showMessage('Error uploading file. Please check your connection and try again.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Upload Timetable';
        loader.style.display = 'none';
    }
});

// Download timetable
document.getElementById('downloadBtn').addEventListener('click', async () => {
    const year = document.getElementById('year').value;
    const semester = document.getElementById('semester').value;
    
    if (!year || !semester) {
        showMessage('Please select both year and semester to download timetable.');
        return;
    }
    
    // Show loading state
    const downloadBtn = document.getElementById('downloadBtn');
    const originalText = downloadBtn.textContent;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Downloading...';
    
    try {
        const response = await fetch(`/download-timetable?year=${encodeURIComponent(year)}&semester=${encodeURIComponent(semester)}`);
        
        if (response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `timetable_${year}_sem${semester}.xlsx`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            showMessage('Timetable downloaded successfully!');
        } else {
            const error = await response.json();
            showMessage(error.message || 'Error downloading timetable. Please try again.');
        }
    } catch (error) {
        console.error('Download error:', error);
        showMessage('Error downloading timetable. Please check your connection and try again.');
    } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = originalText;
    }
});

// Additional utility functions
function validateExcelFile(file) {
    const validExtensions = ['.xlsx', '.xls'];
    const fileName = file.name.toLowerCase();
    return validExtensions.some(ext => fileName.endsWith(ext));
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// File input change handler for better UX
document.getElementById('timetableFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        if (!validateExcelFile(file)) {
            showMessage('Please select a valid Excel file (.xlsx or .xls).');
            e.target.value = '';
            return;
        }
        
        // Show file info
        const fileSize = formatFileSize(file.size);
        console.log(`Selected file: ${file.name} (${fileSize})`);
        
        // Optional: Show file preview or validation
        if (file.size > 10 * 1024 * 1024) { // 10MB limit
            showMessage('File size is too large. Please select a file smaller than 10MB.');
            e.target.value = '';
            return;
        }
    }
});
    </script>
