<style>
:root {
      --bg-color: #0A0A0F;
      --text-color: #E0E0E0;

}
.light-mode {

body {
font-family: 'Inter', sans-serif;
margin: 0;
padding: 0;
background: var(--bg-color);
color: var(--text-color);
overflow-x: hidden;
position: relative;
transition: background 0.3s, color 0.3s;
}
* {

padding: 0;

#particles {

}

background: var(--nav-bg);
padding: 20px 40px;
box-shadow: var(--shadow);

top: 0;
z-index: 1000;
backdrop-filter: blur(10px);
transition: background 0.3s, box-shadow 0.3s;
}
.nav-links {
list-style: none;
display: flex;
align-items: center;
}
.nav-links li {
margin: 0 20px;
}
.nav-links a {
color: var(--text-color);
text-decoration: none;
font-weight: 600;
font-size: 16px;
transition: color 0.3s, transform 0.3s;
}
.nav-links a:hover {
color: #6B34F5;
transform: translateY(-2px);
}
.hamburger {
display: none;
font-size: 28px;
color: var(--text-color);
cursor: pointer;
transition: color 0.3s;
}
@media (max-width: 768px) {
.nav-links {
 display: none;

 background: var(--nav-bg);
 position: absolute;
 top: 80px;
 left: 0;
 width: 100%;
 text-align: center;
 padding: 20px 0;
 transition: background 0.3s;
}

}

}

}
}

}

align-items: center;

}

}

 }

 }
 nav ul li .dropdown-content {
display: none;
position: absolute;
background-color: #f9f9f9;
min-width: 160px;
box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
z-index: 1;
left: 0;
top: 100%;
margin-top: 10px;
}
nav ul li {
position: relative;
}

 nav ul li .dropdown-content a {

 }
 nav ul li .dropdown-content a:hover {

 nav ul li:hover .dropdown-content {

display: block;

  }
    label {
      font-weight: 600;
      color: var(--text-color);

      transition: color 0.3s;
      text-align: center;
      margin-bottom: 20px;

  }
  .table-container {
      width: 100%;

    th, td {

} 
@media (max-width: 768px) {

<div class="tabholder"><table id="bookings-table">

  <!-- Include Flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
    let dropdown = document.querySelector(".dropdown");
    let dropdownMenu = dropdown.querySelector("ul");
    let timeout;

    dropdown.addEventListener("mouseenter", function() {
        clearTimeout(timeout);
        dropdownMenu.style.display = "block";
    });

    dropdown.addEventListener("mouseleave", function() {
        timeout = setTimeout(() => {
            dropdownMenu.style.display = "none";
        }, 200); // Adjust delay time if needed
    });

    dropdownMenu.addEventListener("mouseenter", function() {
        clearTimeout(timeout);
    });

    dropdownMenu.addEventListener("mouseleave", function() {
        timeout = setTimeout(() => {
            dropdownMenu.style.display = "none";
        }, 200);
    });
});
const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
             this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 1;
            this.speedX = Math.random() * 0.5 - 0.25;
            this.speedY = Math.random() * 0.5 - 0.25;
            this.opacity = Math.random() * 0.5 + 0.2;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            else if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            else if (this.y < 0) this.y = canvas.height;
        }
        draw() {
            ctx.fillStyle = document.body.classList.contains('light-mode') ? `rgba(255, 117, 140, ${this.opacity})` : `rgba(107, 52, 245, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
        }
        for (let i = 0; i < 100; i++) {
        particlesArray.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
            particle.update();
            particle.draw();
        });
        requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        });
        const modeToggle = document.getElementById('mode-toggle');
        modeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        modeToggle.querySelector('.slider').textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        });
        window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        modeToggle.querySelector('.slider').textContent = '☀️';
        } else {
            modeToggle.querySelector('.slider').textContent = '🌙';
        }
    });

    const venueSelect = document.getElementById('venue');
    const dateInput = document.getElementById('date');
    const bookingsTable = document.getElementById('bookings-table').querySelector('tbody');

    // Set the default value of the date input to the current date (today's date)
    const today = new Date();
    const day = String(today.getDate()).padStart(2, '0'); // Add leading zero if necessary
    const month = String(today.getMonth() + 1).padStart(2, '0'); // Add leading zero if necessary
    const year = today.getFullYear();

    // Format the date as 'yyyy-mm-dd'
    const formattedDate = `${year}-${month}-${day}`;
    dateInput.value = formattedDate;

    // Function to fetch and display bookings based on the current venue and date
    async function fetchFilteredBookings() {
      const venue = venueSelect.value;
      const date = dateInput.value;
      const url = `/api/filtered-bookings?venue=${venue}&date=${date}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch bookings');
        const data = await response.json();

        bookingsTable.innerHTML = ''; // Clear the table
        if (data.bookings.length === 0) {
          bookingsTable.innerHTML = '<tr><td colspan="5">No bookings found.</td></tr>';
          return;
        }

        data.bookings.forEach(booking => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${booking.venue}</td>
            <td>${booking.date}</td>
            <td>${booking.startTime}</td>
            <td>${booking.endTime}</td>
            <td>${booking.message}</td>
          `;
          bookingsTable.appendChild(row);
        });
      } catch (error) {
        console.error('Error fetching filtered bookings:', error);
        bookingsTable.innerHTML = '<tr><td colspan="5">Failed to load bookings.</td></tr>';
      }
    }

    // Listen for changes to the venue and date inputs to automatically fetch data
    venueSelect.addEventListener('change', fetchFilteredBookings);
    dateInput.addEventListener('change', fetchFilteredBookings);

    // Initial load with default filters
    fetchFilteredBookings();

    // Initialize Flatpickr for the date input
    flatpickr(dateInput, {
      dateFormat: "Y-m-d", // Format for the date (same as the default input date)
      allowInput: true, // Allow manual input
      weekNumbers: true, // Show week numbers
      minDate: "today", // Disable past dates (optional)
    });
// Optional: Hide the dropdown when clicking outside of it
document.addEventListener('click', function (event) {
    const popper = document.querySelector('.popperforvatar');
    const vatar = document.querySelector('.vatar');
    if (popper && !vatar.contains(event.target) && !popper.contains(event.target)) {
        popper.style.display = 'none';
    }
});
const logoutBtn = document.getElementById('logout-btn');
logoutBtn.addEventListener('click', () => {
    // Clear cookies
    document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    document.cookie = 'userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    localStorage.removeItem('email');
    localStorage.removeItem('userEmail');
    history.replaceState(null, null, "/");
    // Redirect to LoginPage
    window.location.href = '/';
});
gsap.from('.navbar', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
        gsap.from('h1', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.2 });
        gsap.from('.form-container', { duration: 1, opacity: 0, scale: 0.9, ease: 'power3.out', delay: 0.4 });
        function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');

    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropbtn');

      button.addEventListener('click', function (e) {
        e.preventDefault();

        // Close other dropdowns
        dropdowns.forEach(d => {
          if (d !== dropdown) d.classList.remove('show');
        });

        // Toggle current dropdown
        dropdown.classList.toggle('show');
      });
    });

    // Close all dropdowns on outside click
    document.addEventListener('click', function (e) {
      dropdowns.forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  });
  </script>
