    <script>
        // Particles Animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') 
                    ? `rgba(255, 117, 140, ${this.opacity})` 
                    : `rgba(144, 2, 70, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 100; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mode Toggle
        const modeToggle = document.getElementById('mode-toggle');
        const slider = modeToggle.querySelector('.slider');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            slider.textContent = '☀️';
        }
        modeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            slider.textContent = isLight ? '☀️' : '🌙';
        });

        // GSAP Animations
        gsap.from('nav', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
        gsap.from('.booking-form', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.2 });

        // Logout and Navigation
        document.getElementById('logout-btn').addEventListener('click', () => {
            document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '/';
        });

        document.addEventListener("DOMContentLoaded", () => {
            fetchSubjects();

            const dropdowns = document.querySelectorAll(".dropdown");
            dropdowns.forEach(dropdown => {
                const dropdownMenu = dropdown.querySelector("ul");
                let timeout;
                dropdown.addEventListener("mouseenter", () => {
                    clearTimeout(timeout);
                    dropdownMenu.style.display = "block";
                });
                dropdown.addEventListener("mouseleave", () => {
                    timeout = setTimeout(() => dropdownMenu.style.display = "none", 200);
                });
                dropdownMenu.addEventListener("mouseenter", () => clearTimeout(timeout));
                dropdownMenu.addEventListener("mouseleave", () => {
                    timeout = setTimeout(() => dropdownMenu.style.display = "none", 200);
                });
            });
        });

        async function fetchSubjects() {
            const response = await fetch("/api/get-subjects");
            const subjects = await response.json();
            const subjectInput = document.getElementById("subjectInput");
            subjects.forEach(subject => {
                const option = document.createElement("option");
                option.value = subject;
                option.textContent = subject;
                subjectInput.appendChild(option);
            });
        }

        document.getElementById("find-slots-btn").addEventListener("click", async () => {
            const date = document.getElementById("dateInput").value;
            const subject = document.getElementById("subjectInput").value;
            const availableSlotsContainer = document.getElementById("available-slots");
            availableSlotsContainer.innerHTML = "";

            if (!date || !subject) {
                showMessage("Please select a date and subject.");
                return;
            }

            const response = await fetch("/api/find-gds-slot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ date, subject }),
            });

            const slots = await response.json();

            if (slots.length === 0) {
                availableSlotsContainer.innerHTML = "<p class='no-slots'>No slots available for the selected subject and date.</p>";
                gsap.from('.no-slots', { duration: 1, opacity: 0, y: 20, ease: 'power3.out' });
                return;
            }

            const bestSlotHeading = document.createElement("h3");
            bestSlotHeading.className = "best-slot-heading";
            bestSlotHeading.textContent = "Best Slot";
            availableSlotsContainer.appendChild(bestSlotHeading);

            slots.forEach((slot, index) => {
                const slotCard = document.createElement("div");
                slotCard.classList.add("slot-card");
                slotCard.innerHTML = `
                    <h4>${slot.startTime} - ${slot.endTime}</h4>
                    <p>Available Teachers: ${slot.teachers.join(", ")}</p>
                    <button class="notify-btn" data-slot="${slot.startTime}-${slot.endTime}" data-teachers='${JSON.stringify(slot.teachers)}'>Notify</button>
                `;
                availableSlotsContainer.appendChild(slotCard);
                gsap.from(slotCard, { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: index * 0.1 });
            });

            document.querySelectorAll(".notify-btn").forEach(button => {
                button.addEventListener("click", async (event) => {
                    const slot = event.target.getAttribute("data-slot");
                    const teachers = JSON.parse(event.target.getAttribute("data-teachers"));
                    if (teachers.length === 0) {
                        showMessage("No teachers to notify.");
                        return;
                    }
                    const notifyResponse = await fetch("/api/notify-gds-slot", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ date, slot, teachers }),
                    });
                    const notifyResult = await notifyResponse.json();
                    showMessage(notifyResult.message || "Error sending notification.");
                });
            });
        });
        function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');

    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropbtn');

      button.addEventListener('click', function (e) {
        e.preventDefault();

        // Close other dropdowns
        dropdowns.forEach(d => {
          if (d !== dropdown) d.classList.remove('show');
        });

        // Toggle current dropdown
        dropdown.classList.toggle('show');
      });
    });

    // Close all dropdowns on outside click
    document.addEventListener('click', function (e) {
      dropdowns.forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  });
  function showMessage(msg) {
  document.getElementById("messageText").textContent = msg;
  const modal = document.getElementById("messageModal");
  modal.style.display = "block";

  document.getElementById("messageOk").onclick = function () {
    modal.style.display = "none";
  };
}
    </script>
