<body>
    <canvas id="particles"></canvas>
    <nav class="navbar">
      <img src="/images/logo.png" id="logo">
      <ul class="nav-links">
        <li class="dropdown">
          <a href="#" class="dropbtn">Teacher Availability</a>

    <div class="booking-container">
        <div class="booking-form">
            <h2>Find an Available Teacher</h2>
            <label for="dateInput">Select Date:</label>
            <input type="date" id="dateInput" required>
            <label for="startTime">Start Time:</label>
            <input type="time" id="startTime" required>
            <label for="endTime">End Time:</label>
            <input type="time" id="endTime" required><br>
            <button id="find-teacher-btn">Find Teachers</button>
        </div>

    <div class="available-teachers-container">
        <h3>Available Teachers</h3>
        <div id="teachers-list"></div>
    </div>
        <div id="messageModal" class="messmodal">
  <div class="messmodal-content">
    <p id="messageText">This is a message.</p>
    <button id="messageOk">OK</button>
  </div>
</div>

    <script>
        // Particles Animation
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.5 - 0.25;
                this.speedY = Math.random() * 0.5 - 0.25;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0;
                else if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                else if (this.y < 0) this.y = canvas.height;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') 
                    ? `rgba(255, 117, 140, ${this.opacity})` 
                    : `rgba(144, 2, 70, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        for (let i = 0; i < 100; i++) particlesArray.push(new Particle());
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mode Toggle
        const modeToggle = document.getElementById('mode-toggle');
        const slider = modeToggle.querySelector('.slider');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            slider.textContent = '☀️';
        }
        modeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            slider.textContent = isLight ? '☀️' : '🌙';
        });

        // GSAP Animations
        gsap.from('nav', { duration: 1, y: -50, opacity: 0, ease: 'power3.out' });
        gsap.from('.booking-form', { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: 0.2 });
        gsap.from('.available-teachers-container h3', { duration: 1, opacity: 0, y: 20, ease: 'power3.out', delay: 0.4 });

        document.getElementById('logout-btn').addEventListener('click', () => {
            document.cookie = 'userName=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'userEmail=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            window.location.href = '/';
        });

        document.addEventListener("DOMContentLoaded", () => {
            const dropdowns = document.querySelectorAll(".dropdown");
            dropdowns.forEach(dropdown => {
                const dropdownMenu = dropdown.querySelector("ul");
                let timeout;
                dropdown.addEventListener("mouseenter", () => {
                    clearTimeout(timeout);
                    dropdownMenu.style.display = "block";
                });
                dropdown.addEventListener("mouseleave", () => {
                    timeout = setTimeout(() => dropdownMenu.style.display = "none", 200);
                });
                dropdownMenu.addEventListener("mouseenter", () => clearTimeout(timeout));
                dropdownMenu.addEventListener("mouseleave", () => {
                    timeout = setTimeout(() => dropdownMenu.style.display = "none", 200);
                });
            });
        });
        document.getElementById("find-teacher-btn").addEventListener("click", async () => {
            const date = document.getElementById("dateInput").value;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;
            const teachersList = document.getElementById("teachers-list");

            if (!date || !startTime || !endTime) {
                showMessage("Please select a date, start time, and end time.");
                return;
            }

            const response = await fetch("/api/find-teacher", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ date, startTime, endTime })
            });

            const teachers = await response.json();
            teachersList.innerHTML = "";

            if (teachers.length === 0) {
                teachersList.innerHTML = "<p class='no-teachers'>No teachers available in the selected time range.</p>";
                gsap.from('.no-teachers', { duration: 1, opacity: 0, y: 20, ease: 'power3.out' });
                return;
            }

            teachers.forEach((teacher, index) => {
                const teacherCard = document.createElement("div");
                teacherCard.classList.add("teacher-card");
                teacherCard.innerHTML = `
                    <div class="teacher-info">
                        <h4>${teacher.name} - ${teacher.subject}</h4>
                        <p><span class='available'>Available</span></p>
                    </div>
                    <button class='notify-btn' data-name='${teacher.name}' data-email='${teacher.email}'>Notify</button>
                `;
                teachersList.appendChild(teacherCard);
                gsap.from(teacherCard, { duration: 1, opacity: 0, y: 50, ease: 'power3.out', delay: index * 0.1 });
            });

            document.querySelectorAll(".notify-btn").forEach(button => {
                button.addEventListener("click", async (event) => {
                    const teacherName = event.target.getAttribute("data-name");
                    const teacherEmail = event.target.getAttribute("data-email");
                    const notifyResponse = await fetch("/api/notify-teacher", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ teacherName, teacherEmail, date, startTime, endTime })
                    });
                    const notifyResult = await notifyResponse.json();
                    showMessage(notifyResult.message || "Error sending notification.");
                });
            });
        });
        function toggleMenu() {
      const navLinks = document.querySelector('.nav-links');
      navLinks.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function () {
    const dropdowns = document.querySelectorAll('.dropdown');

    dropdowns.forEach(dropdown => {
      const button = dropdown.querySelector('.dropbtn');

      button.addEventListener('click', function (e) {
        e.preventDefault();

        // Close other dropdowns
        dropdowns.forEach(d => {
          if (d !== dropdown) d.classList.remove('show');
        });

        // Toggle current dropdown
        dropdown.classList.toggle('show');
      });
    });

    // Close all dropdowns on outside click
    document.addEventListener('click', function (e) {
      dropdowns.forEach(dropdown => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('show');
        }
      });
    });
  });
      function showMessage(msg) {
  document.getElementById("messageText").textContent = msg;
  const modal = document.getElementById("messageModal");
  modal.style.display = "block";

  document.getElementById("messageOk").onclick = function () {
    modal.style.display = "none";
  };
}
    </script>
</body>
